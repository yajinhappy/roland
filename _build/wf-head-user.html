<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 화면정의서 · 사용자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #E9EBEF; color: #171B22;
    font-family: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  .app { height: 100%; display: flex; flex-direction: column; }

  /* 상단 — 문서 크롬 한 줄. 화면 이동과 보기 토글만 둔다 */
  .nav { flex: none; display: flex; align-items: stretch; height: 56px; padding: 0 26px;
    background: #fff; border-bottom: 1px solid #D9DEE5; overflow-x: auto;
    scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 22px;
    padding-right: 22px; border-right: 1px solid #E4E8ED; align-self: center; height: 26px;
    flex: none; }
  .brand b { color: #171B22; font-size: 13.5px; font-weight: 600; letter-spacing: -.015em;
    white-space: nowrap; }
  .brand span { color: #8A929E; font-size: 11.5px; letter-spacing: .01em; white-space: nowrap; }
  .nvg { display: flex; align-items: center; flex: none; padding: 0 12px 0 4px;
    font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .12em;
    color: #A0A8B4; }
  .nv { display: flex; flex-direction: column; justify-content: center; gap: 1px; border: 0;
    border-bottom: 2px solid transparent; background: transparent; color: #6C7480;
    padding: 0 12px; cursor: pointer; font-family: inherit; flex: none; text-align: left; }
  .nv b { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .07em;
    font-weight: 500; color: #A0A8B4; }
  .nv span { font-size: 12.5px; letter-spacing: -.01em; white-space: nowrap; }
  .nv:hover { color: #171B22; }
  .nv:hover b { color: #6C7480; }
  .nv.on { color: #171B22; border-bottom-color: #2F6490; font-weight: 500; }
  .nv.on b { color: #2F6490; }
  .nv:focus-visible { outline: 2px solid #2F6490; outline-offset: -3px; }

  .stage { flex-grow: 1; min-height: 0; position: relative; background: #E9EBEF; }
  .screen { display: none; height: 100%; }
  .screen.on { display: block; }

  .screen .wstage > div { flex: none; background: #fff; border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(23, 27, 34, .07),
                0 2px 4px rgba(23, 27, 34, .06),
                0 22px 50px -20px rgba(23, 27, 34, .30); }
  .screen .pane-mo .wstage > div { border-radius: 14px; }

  .pane { flex-grow: 1; min-height: 0; display: none; }
  .pane.on { display: flex; }
  .pane > .wstage { width: 100%; }

  /* ---- 스크롤바 — 없애지 않되 얇게, 자리는 항상 잡아 둔다 ---- */
  .screen .wstage, .screen .dcol {
    scrollbar-width: thin; scrollbar-color: #C3CBD4 transparent;
    scrollbar-gutter: stable; }
  .screen .wstage::-webkit-scrollbar,
  .screen .dcol::-webkit-scrollbar { width: 10px; height: 10px; }
  .screen .wstage::-webkit-scrollbar-track,
  .screen .dcol::-webkit-scrollbar-track { background: transparent; }
  .screen .wstage::-webkit-scrollbar-thumb,
  .screen .dcol::-webkit-scrollbar-thumb { background: #C3CBD4; border-radius: 5px;
    border: 3px solid transparent; background-clip: content-box; }
  .screen .wstage::-webkit-scrollbar-thumb:hover,
  .screen .dcol::-webkit-scrollbar-thumb:hover { background: #96A3B0;
    background-clip: content-box; }

  /* ---- 디스크립션 — 덮지 않고 밀어내는 방식 ---- */
  body.desc-off .screen .dcol { display: none !important; }

  .screen .wstage .mk, .screen .wstage .mk-s { cursor: pointer;
    transition: box-shadow .12s, background .12s; }
  .screen .wstage .mk:hover, .screen .wstage .mk-s:hover { background: #2A5273 !important; }
  .screen .wstage .mk.act, .screen .wstage .mk-s.act { background: #2A5273 !important;
    box-shadow: 0 0 0 4px rgba(61, 110, 150, .22); }
  .screen .dr.hit, .screen .dr-alt.hit { background: #EDF4F9 !important;
    box-shadow: inset 3px 0 0 #3D6E96; }

  .ctl { margin-left: auto; display: flex; align-items: center; gap: 12px; flex: none;
    padding-left: 16px; }

  .tabctl { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .pcw { display: none; align-items: center; gap: 9px; }
  .wcol.is-pc .pcw { display: flex; }
  .pcw-lbl { color: #7A828E; font-size: 11px; letter-spacing: .01em; }
  .pcw-seg { display: flex; border: 1px solid #C9D0D9; border-radius: 4px;
    overflow: hidden; background: #fff; }
  .wbtn { border: 0; border-left: 1px solid #C9D0D9; background: #fff; color: #6C7480;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 0 13px; height: 30px;
    cursor: pointer; }
  .wbtn:first-child { border-left: 0; }
  .wbtn:hover { background: #EEF1F4; color: #171B22; }
  .wbtn.on { background: #2F6490; color: #fff; }
  .wbtn:focus-visible { outline: 2px solid #171B22; outline-offset: -2px; }
  .zoom { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: #7A828E;
    letter-spacing: .04em; min-width: 108px; text-align: right; }

  .desc-btn { display: flex; align-items: center; gap: 8px; border: 1px solid #C9D0D9;
    background: #fff; color: #434A57; font-family: inherit; font-size: 12px;
    padding: 0 15px; height: 32px; border-radius: 4px; cursor: pointer; align-self: center;
    white-space: nowrap; }
  .desc-btn:hover { background: #EEF1F4; color: #171B22; }
  .desc-btn:focus-visible { outline: 2px solid #2F6490; outline-offset: 1px; }
  .desc-btn i { font-style: normal; font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: #99A2AE; }
  .desc-btn .lbl-off { display: none; }
  .desc-btn .lbl-on { display: inline; }
  body.desc-off .desc-btn { background: #2F6490; border-color: #2F6490; color: #fff; }
  body.desc-off .desc-btn i { color: #B9D3E6; }
  body.desc-off .desc-btn .lbl-off { display: inline; }
  body.desc-off .desc-btn .lbl-on { display: none; }

  /* ══════════════ 화면 내부 ══════════════ */
  a { color: #2F6490; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; word-break: normal; }
  .shd { display: none; }
  .wrap2 { flex-grow: 1; min-height: 0; padding: 0; display: flex; gap: 0; align-items: stretch; }

  /* ---- 디스크립션 컬럼 ---- */
  .dcol { order: 1; width: 430px; flex: none; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; background: #fff;
    border-left: 1px solid #D9DEE5; padding: 0 0 44px; }
  .dcol h4 { position: sticky; top: 0; z-index: 3; margin: 0; height: 56px;
    display: flex; align-items: center; padding: 0 24px;
    font-size: 11.5px; font-weight: 600; color: #545C69;
    background: #fff; border-bottom: 1px solid #E4E8ED; }
  .dr, .dr-alt { display: flex; flex-direction: column; gap: 11px;
    padding: 18px 24px 22px; border-bottom: 1px solid #EAEDF1; background: #fff; }
  .dr-alt { background: #F3F8FC; }
  .dr-h { display: flex; align-items: center; gap: 10px; }
  .dr-t { font-size: 14px; font-weight: 600; color: #171B22; letter-spacing: -.012em; }
  .dr-b { margin: 0; font-size: 12.5px; line-height: 1.78; color: #434A57;
    word-break: keep-all; }
  .dr-b b { color: #171B22; font-weight: 600; }
  .src { font-size: 10.5px; color: #5E6875; background: #EEF1F4;
    border: 1px solid #DFE4EA; border-radius: 3px; padding: 2px 8px;
    margin-left: auto; white-space: nowrap; }
  .spec { border: 1px solid #E1E6EC; border-radius: 4px; overflow: hidden; background: #fff; }
  .spec-r { display: flex; gap: 10px; padding: 8px 11px; border-bottom: 1px solid #EFF2F5; }
  .spec-r:last-child { border-bottom: 0; }
  .spec-k { flex: none; width: 96px; font-size: 11px; color: #171B22; font-weight: 500;
    line-height: 1.6; }
  .spec-v { font-size: 11px; color: #676E7B; line-height: 1.62; word-break: keep-all; }
  .spec-v b { color: #2F6490; font-weight: 600; }
  .imm { border: 1px solid #C6DCEC; border-radius: 4px; overflow: hidden; background: #FAFDFF; }
  .imm-h { font-size: 10px; letter-spacing: .06em; font-weight: 600; color: #2F6490;
    background: #E9F3FA; padding: 6px 11px; border-bottom: 1px solid #D5E6F2; }
  .imm-r { display: flex; gap: 10px; padding: 7px 11px; border-bottom: 1px solid #EDF4F9; }
  .imm-r:last-child { border-bottom: 0; }
  .imm-k { flex: none; width: 72px; font-size: 10.5px; color: #4A7FA5; line-height: 1.6; }
  .imm-v { font-size: 11px; color: #434A57; line-height: 1.6; word-break: keep-all; }
  .warn { border: 1px solid #E0BEBE; border-radius: 4px; overflow: hidden; background: #FDF7F7; }
  .warn-h { font-size: 10px; letter-spacing: .06em; font-weight: 600; color: #8C3A3A;
    background: #F9EEEE; padding: 6px 11px; border-bottom: 1px solid #EBD3D3; }
  .warn-b { font-size: 11px; color: #434A57; line-height: 1.7; padding: 8px 11px;
    margin: 0; word-break: keep-all; }

  /* ---- 캔버스 ---- */
  .wcol { order: 0; flex-grow: 1; min-width: 0; min-height: 0; background: #E9EBEF;
    display: flex; flex-direction: column; }
  .tabs { flex: none; display: flex; align-items: center; height: 56px; padding: 0 26px; }
  .tab { border: 1px solid #C9D0D9; border-right: 0; background: #fff; color: #6C7480;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .06em;
    width: 74px; height: 30px; cursor: pointer; border-radius: 0; padding: 0; }
  .tab-on { border: 1px solid #2F6490; border-right: 0; background: #2F6490; color: #fff;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .06em;
    width: 74px; height: 30px; cursor: pointer; border-radius: 0; padding: 0; }
  .tabs > button:first-of-type { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .tabs > button:last-of-type { border-right: 1px solid #C9D0D9;
    border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .tabs > button.tab-on:last-of-type { border-right-color: #2F6490; }
  .tab:focus-visible, .tab-on:focus-visible { outline: 2px solid #171B22; outline-offset: 2px; }
  .wstage { flex-grow: 1; min-height: 0; overflow: auto; padding: 2px 26px 44px;
    display: flex; justify-content: center; align-items: flex-start; }

  /* ---- 공통 요소 ---- */
  .bx { border: 1px solid #D5DBE2; background: #FFF; border-radius: 3px; }
  .img { border: 1px dashed #A5B2BF; background: #F0F4F7; border-radius: 3px;
    display: flex; align-items: center; justify-content: center; text-align: center; }
  .sp { font-size: 10px; color: #78859A; line-height: 1.6; letter-spacing: 0; }
  .key { border: 1px dashed #8FB2CE; background: #F4F9FC; }
  .lbl-k { font-size: 10.5px; letter-spacing: .04em; font-weight: 600; color: #2F6490; }
  .t { font-size: 13px; color: #2C333D; line-height: 1.5; }
  .tm { font-size: 12px; color: #6C7480; line-height: 1.55; }
  .ts { font-size: 11px; color: #868E9A; }
  .tx { font-size: 10px; color: #98A2AE; }
  .h { font-size: 17px; font-weight: 600; letter-spacing: -.02em; color: #171B22; }
  .h-s { font-size: 15px; font-weight: 600; letter-spacing: -.015em; color: #171B22; }
  .ttl { font-size: 30px; font-weight: 600; letter-spacing: -.03em; color: #1D242D; line-height: 1.2; }
  .ttl-s { font-size: 22px; font-weight: 600; letter-spacing: -.025em; color: #1D242D; line-height: 1.25; }
  .num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  .btn, .btn-p, .btn-m, .btn-mo, .btn-s, .btn-ps { white-space: nowrap; }
  .btn { border: 1px solid #AEB7C2; background: #fff; color: #434A57; font-size: 12.5px;
    padding: 10px 18px; text-align: center; border-radius: 4px; }
  .btn-p { border: 1px solid #2C333D; background: #2C333D; color: #fff; font-size: 12.5px;
    padding: 10px 18px; text-align: center; border-radius: 4px; }
  .btn-m { border: 1px solid #2C333D; background: #2C333D; color: #fff; font-size: 13px;
    padding: 13px 16px; text-align: center; border-radius: 4px; }
  .btn-mo { border: 1px solid #AEB7C2; background: #fff; color: #434A57; font-size: 13px;
    padding: 13px 16px; text-align: center; border-radius: 4px; }
  .btn-s { border: 1px solid #C4CCD5; background: #fff; color: #545C69; font-size: 11px;
    padding: 5px 11px; text-align: center; border-radius: 3px; }
  .btn-ps { border: 1px solid #2F6490; background: #2F6490; color: #fff; font-size: 11px;
    padding: 5px 11px; text-align: center; border-radius: 3px; }

  .chip { border: 1px solid #D5DBE2; background: #F3F5F7; font-size: 10.5px; padding: 4px 10px;
    border-radius: 20px; color: #6C7480; white-space: nowrap; }
  .chip-on { border: 1px solid #2F6490; background: #2F6490; font-size: 10.5px; padding: 4px 10px;
    border-radius: 20px; color: #fff; white-space: nowrap; }
  .tag { border: 1px solid #AECAE0; background: #EBF3F9; color: #2F6490; font-size: 10px;
    padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .tag-g { border: 1px solid #B4D6C2; background: #EDF7F1; color: #2E6B45; font-size: 10px;
    padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .tag-r { border: 1px solid #E0BEBE; background: #F9EEEE; color: #8C3A3A; font-size: 10px;
    padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .tag-a { border: 1px solid #E2D5B9; background: #F8F2E6; color: #8A6420; font-size: 10px;
    padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .tag-n { border: 1px solid #D5DBE2; background: #F3F5F7; color: #6C7480; font-size: 10px;
    padding: 2px 7px; border-radius: 3px; white-space: nowrap; }

  .mk { width: 20px; height: 20px; border-radius: 50%; background: #2F6490; color: #fff;
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; flex: none;
    box-shadow: 0 0 0 2px #fff; z-index: 36; }
  .mk-s { width: 18px; height: 18px; border-radius: 50%; background: #2F6490; color: #fff;
    font-family: "IBM Plex Mono", monospace; font-size: 9px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; flex: none;
    box-shadow: 0 0 0 2px #fff; z-index: 36; }
  .sec { position: relative; }
  .ico { flex: none; color: #6C7480; }
  .gnb { font-size: 13.5px; font-weight: 500; letter-spacing: -.005em; color: #232B35;
    white-space: nowrap; }
  .shd .id, .shd .nm { display: none; }

  /* ---- 어드민 셸 ---- */
  .ahd { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 24px;
    border-bottom: 1px solid #E4E8ED; background: #fff; }
  .alogo { font-size: 13px; font-weight: 600; letter-spacing: -.015em; color: #171B22; }
  .ent { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;
    border: 1px solid #C9D0D9; border-radius: 4px; background: #fff; font-size: 12px;
    color: #2C333D; white-space: nowrap; }
  .ent .mono { font-size: 11px; color: #2F6490; font-weight: 500; }
  .abody { display: flex; align-items: stretch; min-height: 0; }
  .snb { width: 232px; flex: none; border-right: 1px solid #E4E8ED; background: #FAFBFC;
    padding: 16px 0 28px; }
  .snb-g { padding: 12px 20px 6px; font-family: "IBM Plex Mono", monospace; font-size: 9.5px;
    letter-spacing: .11em; color: #98A2AE; }
  .snb-i { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 12.5px;
    color: #545C69; border-left: 2px solid transparent; }
  .snb-i .mono { font-size: 10px; color: #A0A8B4; flex: none; width: 30px; }
  .snb-i.on { background: #EBF3F9; color: #2F6490; font-weight: 600;
    border-left-color: #2F6490; }
  .snb-i.on .mono { color: #2F6490; }
  .amain { flex-grow: 1; min-width: 0; padding: 24px 28px 36px; background: #F7F8FA; }
  .atitle { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 4px; }
  .abar { display: flex; align-items: center; gap: 8px; margin: 18px 0 14px; }
  .fltr { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px;
    border: 1px solid #C9D0D9; border-radius: 4px; background: #fff; font-size: 11.5px;
    color: #545C69; white-space: nowrap; }
  .card { background: #fff; border: 1px solid #E1E6EC; border-radius: 4px; }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 13px 16px;
    border-bottom: 1px solid #EDF0F4; }

  /* ---- 데이터 그리드 ---- */
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .05em;
    color: #7A828E; background: #F5F7F9; padding: 9px 12px; border-bottom: 1px solid #E1E6EC;
    white-space: nowrap; }
  .tbl td { padding: 11px 12px; border-bottom: 1px solid #EFF2F5; font-size: 12px;
    color: #545C69; vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl td b { color: #171B22; font-weight: 600; }
  .tbl td .mono { font-size: 11px; }
  .tbl-z tr:nth-child(even) td { background: #FCFDFE; }

  /* ---- 폼 ---- */
  .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld > label { font-size: 11px; color: #545C69; font-weight: 500; }
  .fld > label i { font-style: normal; color: #8C3A3A; margin-left: 3px; }
  .inp { height: 34px; border: 1px solid #C9D0D9; border-radius: 4px; background: #fff;
    display: flex; align-items: center; padding: 0 11px; font-size: 12px; color: #6C7480; }
  .inp.fill { color: #2C333D; }
  .inp.sel { justify-content: space-between; }
  .inp.lock { background: #F3F5F7; color: #98A2AE; }
  .hint { font-size: 10.5px; color: #98A2AE; line-height: 1.55; }

  /* ---- 스위치 ---- */
  .sw { width: 34px; height: 19px; border-radius: 10px; background: #C9D0D9; position: relative;
    flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(23,27,34,.2); }
  .sw.on { background: #2F6490; }
  .sw.on::after { left: auto; right: 2px; }

  /* ---- 상태 점 ---- */
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
  .dot-g { background: #3E9A63; }
  .dot-r { background: #C0504D; }
  .dot-a { background: #D3A03C; }
  .dot-n { background: #B4BCC6; }

  /* ---- 모달 ---- */
  .scrim { position: absolute; inset: 0; background: rgba(23,27,34,.34); z-index: 40;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 64px; }
  .modal { background: #fff; border-radius: 6px; box-shadow: 0 20px 60px rgba(23,27,34,.34);
    display: flex; flex-direction: column; overflow: visible; position: relative; }
  .modal-h { display: flex; align-items: center; gap: 10px; padding: 15px 20px;
    border-bottom: 1px solid #E4E8ED; }
  .modal-b { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .modal-f { padding: 14px 20px; border-top: 1px solid #E4E8ED; background: #FAFBFC;
    display: flex; justify-content: flex-end; gap: 8px; }

  /* ---- 결제창 ---- */
  .pay-h { background: #2C333D; color: #fff; padding: 15px 20px; display: flex;
    align-items: center; gap: 10px; border-radius: 6px 6px 0 0; }
  .pay-h b { font-size: 13.5px; font-weight: 600; }
  .pay-h span { font-size: 10.5px; color: #A9B4C0; }
  .mtd { border: 1px solid #D5DBE2; border-radius: 4px; padding: 11px 8px; text-align: center;
