<style>
  :root {
    --ground: #EDEEF1; --surface: #FFFFFF; --surface-2: #F5F6F8;
    --line: #D9DEE5; --hair: #E7EAEF;
    --ink: #171B22; --ink-mid: #434A57; --ink-soft: #6C7480; --ink-faint: #949BA7;
    --accent: #2F6490; --accent-soft: #EBF3F9; --accent-line: #AECAE0;
    --warm: #8A6420; --warm-soft: #F8F2E6; --warm-line: #E2D5B9;
    --bad: #8C3A3A; --bad-soft: #F9EEEE; --bad-line: #E0BEBE;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12151B; --surface: #191D25; --surface-2: #1F242D;
      --line: #333A46; --hair: #272D37;
      --ink: #E9ECF2; --ink-mid: #B6BDC9; --ink-soft: #8B93A1; --ink-faint: #6B7280;
      --accent: #7BAAD2; --accent-soft: #1B2836; --accent-line: #2E4A66;
      --warm: #D9B571; --warm-soft: #2A2418; --warm-line: #4A3E24;
      --bad: #D89393; --bad-soft: #2C1C1C; --bad-line: #4E3030;
    }
  }
  :root[data-theme="dark"] {
    --ground: #12151B; --surface: #191D25; --surface-2: #1F242D;
    --line: #333A46; --hair: #272D37;
    --ink: #E9ECF2; --ink-mid: #B6BDC9; --ink-soft: #8B93A1; --ink-faint: #6B7280;
    --accent: #7BAAD2; --accent-soft: #1B2836; --accent-line: #2E4A66;
    --warm: #D9B571; --warm-soft: #2A2418; --warm-line: #4A3E24;
    --bad: #D89393; --bad-soft: #2C1C1C; --bad-line: #4E3030;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  /* 한글은 어절 중간에서 끊기면 읽기 어려우므로 keep-all 로 어절 단위 줄바꿈 */
  body { background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px; line-height: 1.78; -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: break-word; }
  p, li, td, th, figcaption, .lede, .stand, .cap, .row .d, .note p, .part p, dd {
    text-wrap: pretty; }
  h1, h2, h3, h4, h5, .row .t, .card h5 { text-wrap: balance; word-break: keep-all; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; word-break: normal; }

  .shell { display: flex; align-items: flex-start; gap: 0; }
  .tscroll, .flow, .cols, pre, .note, ul.rule { max-width: 1560px; }

  /* ── LNB ───────────────────────────────────────── */
  .lnb { position: sticky; top: 0; align-self: flex-start; flex: none; width: 262px;
    height: 100vh; overflow-y: auto; padding: 26px 20px 28px 24px; overscroll-behavior: contain;
    border-right: 1px solid var(--line); background: var(--surface); }
  .lnb .bmark { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.018em;
    color: var(--ink); margin-bottom: 3px; }
  .lnb .bsub { display: block; font-family: "IBM Plex Mono", monospace; font-size: 9.5px;
    letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint);
    margin-bottom: 16px; }
  .lnb .grp { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .15em;
    text-transform: uppercase; color: var(--ink-faint); margin: 15px 0 5px; }
  .lnb .grp:first-of-type { margin-top: 0; }
  .lnb a { display: block; text-decoration: none; color: var(--ink-soft); font-size: 13px;
    padding: 5px 11px; border-radius: 4px; line-height: 1.4; }
  .lnb a:hover { background: var(--surface-2); color: var(--ink); }
  .lnb a.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .lnb a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lnb .tag { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 9px;
    letter-spacing: .08em; color: var(--warm); border: 1px solid var(--warm-line);
    background: var(--warm-soft); border-radius: 3px; padding: 1px 5px; margin-left: 6px;
    vertical-align: 1px; }

  /* ── 본문 ──────────────────────────────────────── */
  main { flex-grow: 1; min-width: 0; padding: 40px 52px 110px; }
  @media (max-width: 860px) {
    .shell { display: block; }
    .lnb { position: static; width: auto; height: auto; border-right: 0;
      border-bottom: 1px solid var(--line); }
    main { padding: 28px 22px 80px; }
  }

  header.mast { padding-bottom: 24px; border-bottom: 2px solid var(--ink); }
  .kick { font-family: "IBM Plex Mono", monospace; font-size: .72rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
  h1 { font-size: clamp(1.7rem, 3.6vw, 2.25rem); font-weight: 600; line-height: 1.3;
    letter-spacing: -.026em; margin: 0 0 12px; }
  .stand { font-size: 1.02rem; color: var(--ink-mid); max-width: 76ch; margin: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--hair); font-family: "IBM Plex Mono", monospace;
    font-size: .72rem; color: var(--ink-faint); }
  .meta b { color: var(--ink-soft); font-weight: 500; }

  .part { margin-top: 62px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .part .n { font-family: "IBM Plex Mono", monospace; font-size: .7rem; letter-spacing: .16em;
    color: var(--accent); display: block; margin-bottom: 6px; }
  .part h2 { font-size: 1.5rem; font-weight: 600; letter-spacing: -.026em; margin: 0 0 8px; }
  .part p { margin: 0; color: var(--ink-mid); max-width: 76ch; font-size: .95rem; }

  section { margin-top: 46px; scroll-margin-top: 24px; }
  h3 { font-size: 1.18rem; font-weight: 600; letter-spacing: -.022em; line-height: 1.45;
    margin: 0 0 8px; }
  .lede { color: var(--ink-mid); max-width: 76ch; margin: 0 0 22px; }
  h4 { font-size: .93rem; font-weight: 600; margin: 30px 0 12px; letter-spacing: -.012em; }
  p { max-width: 76ch; margin: 0 0 14px; }
  b { font-weight: 600; }

  .tscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 5px;
    background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: .86rem; }
  thead th { text-align: left; font-size: .69rem; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-faint); background: var(--surface-2);
    padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--hair); vertical-align: top;
    color: var(--ink-mid); line-height: 1.68; }
  tbody tr:last-child td { border-bottom: 0; }
  td:first-child { color: var(--ink); font-weight: 500; }
  .cap { font-size: .78rem; color: var(--ink-faint); margin: 10px 0 0; max-width: 80ch;
    line-height: 1.7; }

  ul.rule { list-style: none; padding: 0; margin: 0; counter-reset: r; }
  ul.rule > li { counter-increment: r; position: relative; padding: 15px 0 15px 42px;
    border-bottom: 1px solid var(--hair); color: var(--ink-mid); max-width: 80ch; }
  ul.rule > li:last-child { border-bottom: 0; }
  ul.rule > li::before { content: counter(r); position: absolute; left: 0; top: 15px;
    width: 25px; height: 25px; border-radius: 50%; background: var(--accent); color: #fff;
    font-family: "IBM Plex Mono", monospace; font-size: .7rem;
    display: flex; align-items: center; justify-content: center; }
  ul.rule b { color: var(--ink); }

  .flow { display: flex; flex-direction: column; gap: 10px; margin: 0 0 12px; }
  .row { display: flex; gap: 14px; align-items: flex-start; background: var(--surface);
    border: 1px solid var(--line); border-radius: 5px; padding: 15px 18px; }
  .row.key { border-color: var(--accent-line); background: var(--accent-soft); }
  .row .k { font-family: "IBM Plex Mono", monospace; font-size: .74rem; color: var(--accent);
    flex: none; width: 20px; padding-top: 2px; }
  .row .b { flex-grow: 1; min-width: 0; }
  .row .t { font-weight: 600; font-size: .95rem; display: block; margin-bottom: 4px; }
  .row .d { font-size: .87rem; color: var(--ink-mid); line-height: 1.72; max-width: 92ch; }

  pre { font-family: "IBM Plex Mono", monospace; font-size: .8rem; line-height: 1.85;
    background: var(--surface); border: 1px solid var(--line); border-radius: 5px;
    padding: 18px 20px; overflow-x: auto; margin: 0 0 12px; color: var(--ink-mid);
    word-break: normal; }
  pre b { color: var(--ink); font-weight: 500; }
  pre .a { color: var(--accent); }
  pre .f { color: var(--ink-faint); }

  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 5px;
    padding: 18px 20px 20px; }
  .card h5 { margin: 0 0 10px; font-size: .72rem; font-family: "IBM Plex Mono", monospace;
    letter-spacing: .1em; text-transform: uppercase; padding-bottom: 9px;
    border-bottom: 1px solid var(--hair); font-weight: 600; }
  .card.a h5 { color: var(--ink-faint); }
  .card.b h5 { color: var(--accent); }
  .card.warn h5 { color: var(--bad); }
  .card ul { list-style: none; margin: 0; padding: 0; font-size: .87rem; }
  .card li { padding: 7px 0; color: var(--ink-mid); border-bottom: 1px solid var(--hair); }
  .card li:last-child { border-bottom: 0; }
  .card li b { color: var(--ink); }

  .note { background: var(--warm-soft); border: 1px solid var(--warm-line); border-radius: 5px;
    padding: 16px 20px; margin: 0 0 14px; }
  .note .lb { font-family: "IBM Plex Mono", monospace; font-size: .68rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--warm); display: block; margin-bottom: 7px; }
  .note p { margin: 0; font-size: .89rem; color: var(--ink-mid); max-width: 80ch; }
  .note.q { background: var(--accent-soft); border-color: var(--accent-line); }
  .note.q .lb { color: var(--accent); }
  .note.bad { background: var(--bad-soft); border-color: var(--bad-line); }
  .note.bad .lb { color: var(--bad); }

  /* 원문 인용 */
  blockquote { margin: 0 0 14px; padding: 14px 20px; border-left: 3px solid var(--accent-line);
    background: var(--surface); border-radius: 0 5px 5px 0; max-width: 92ch; }
  blockquote p { margin: 0 0 6px; font-size: .89rem; color: var(--ink-mid); max-width: none; }
  blockquote p:last-child { margin: 0; }
  blockquote .src { font-family: "IBM Plex Mono", monospace; font-size: .68rem;
    letter-spacing: .06em; color: var(--ink-faint); display: block; margin-top: 8px; }
  blockquote em { font-style: normal; color: var(--ink); font-weight: 500; }

  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--ink); }
  .ext { display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-family: "IBM Plex Mono", monospace; font-size: .72rem; letter-spacing: .02em;
    color: var(--accent); border: 1px solid var(--accent-line); background: var(--accent-soft);
    padding: 4px 10px; border-radius: 4px; white-space: nowrap; }
  .ext::after { content: "↗"; font-size: .95em; opacity: .65; }
  .ext:hover { border-color: var(--accent); color: var(--accent); filter: brightness(.97); }
  .ext:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sechead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 8px; }
  .sechead h3 { margin: 0; }
  td a { word-break: break-all; }

  .verdict { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: .66rem;
    letter-spacing: .08em; text-transform: uppercase; border-radius: 3px; padding: 2px 7px;
    vertical-align: 2px; white-space: nowrap; }
  .verdict.yes { color: var(--accent); border: 1px solid var(--accent-line);
    background: var(--accent-soft); }
  .verdict.no { color: var(--bad); border: 1px solid var(--bad-line);
    background: var(--bad-soft); }

  footer.doc { margin-top: 62px; padding-top: 20px; border-top: 1px solid var(--line);
    font-size: .78rem; color: var(--ink-faint); }
  footer.doc p { max-width: 80ch; margin: 0 0 6px; line-height: 1.7; }
  footer.doc h4 { font-size: .78rem; color: var(--ink-soft); margin: 18px 0 8px; }
  footer.doc ul { margin: 0 0 6px; padding-left: 18px; }
  footer.doc li { margin-bottom: 4px; line-height: 1.7; }

  @media print {
    .lnb { display: none; }
    body { background: #fff; font-size: 11pt; }
    main { padding: 0; }
    .row, .card, pre, .tscroll, blockquote, .note { break-inside: avoid; }
  }

  /* ---- Part 4 : 대조 도식 ---- */
  .dia { margin: 20px 0 10px; max-width: 1560px; }
  .dia svg { width: 100%; height: auto; display: block;
    background: var(--surface); border: 1px solid var(--line); border-radius: 5px; }
  .dia figcaption { font-size: .8rem; color: var(--ink-soft); margin-top: 9px;
    text-wrap: pretty; word-break: keep-all; }
  .dia svg text { font-family: "IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
    fill: var(--ink-mid); }
  .dia svg .dh { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
  .dia svg .dt { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .dia svg .ds { font-size: 10.5px; fill: var(--ink-mid); }
  .dia svg .dx { font-size: 9.5px; fill: var(--ink-soft); }
  .dia svg .dl { font-size: 9.5px; letter-spacing: .06em; }
  .dia svg .a { fill: var(--accent); }
  .dia svg .f { fill: var(--ink-faint); }
  .dia svg .bad { fill: var(--bad); }
  .dia svg .ln { stroke: var(--ink-faint); stroke-width: 1.1; fill: none; }
  .dia svg .ln-hair { stroke: var(--hair); stroke-width: 1; fill: none; }
  .dia svg .bx-key { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1; }
  .dia svg .bx-pill { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1; }
  .dia svg .bx-mute { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
  .dia svg .bx-bad { fill: var(--bad-soft); stroke: var(--bad-line); stroke-width: 1;
    stroke-dasharray: 4 3; }
  .dia svg .chip rect { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
  .dia svg .chip text { font-size: 10px; fill: var(--ink-soft); }
  .grp2 { font-size: .78rem; font-weight: 600; color: var(--ink-soft);
    margin: 26px 0 8px; padding-left: 10px; border-left: 2px solid var(--accent-line); }
  .verdict.ko { font-family: inherit; letter-spacing: 0; text-transform: none;
    font-size: .72rem; font-weight: 600; }
  td.bad-cell { background: var(--bad-soft); }

  /* LNB 스크롤바 — 평소 숨김 · 커서 올릴 때만 노출 (gutter 고정으로 레이아웃 이동 없음) */
  .lnb { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  .lnb:hover { scrollbar-color: var(--line) transparent; }
  .lnb::-webkit-scrollbar { width: 6px; }
  .lnb::-webkit-scrollbar-track { background: transparent; }
  .lnb::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px;
    transition: background .15s ease; }
  .lnb:hover::-webkit-scrollbar-thumb { background: var(--line); }
  .lnb:hover::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
</style>
