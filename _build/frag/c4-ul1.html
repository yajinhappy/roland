  <ul class="rule">
    <li><b>지금 결제가 열리는가</b> — 열림 · 부분 열림 · 닫힘 셋 중 하나로 답한다. 「부분 열림」은 게임 하나는 되고 다른 하나는 안 되는 상태다.</li>
    <li><b>안 열리면 무엇이 막고 있는가</b> — 막고 있는 항목을 나열하고, 고칠 수 있는 화면으로 바로 이동시킨다.</li>
    <li><b>본사 대기와 지사 할 일을 구분한다</b> — 「PG 키 본사 세팅 대기」로 뜨면 기다리면 되고, 「상품 가격 미입력」이면 지사가 지금 하면 된다.</li>
  </ul>
